@if (visible()) {
  <div class="tag" [class]="type()" [class.dismissible]="dismissible()"
    animate.enter="slide-enter" animate.leave="slide-leave">
    <span>{{ text() }}</span>
    @if (dismissible()) {
      <svg-icon class="close" [src]="srcClose" (click)="close()"></svg-icon>
    }
  </div>
}
