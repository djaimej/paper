<label class="checkbox">
  <input #el [id]="id()" class="checkbox__input" type="checkbox" [checked]="controlValue()" [disabled]="isDisabled()"
    (change)="update(el.checked)">
  <span class="checkbox__checkmark">
    <svg-icon src="icons/interface-interaction/check.svg" aria-hidden="true"></svg-icon>
  </span>
  <span class="checkbox__label">{{ label() }}</span>
</label>
