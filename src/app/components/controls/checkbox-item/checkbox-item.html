<label class="checkbox">
  <input  [(ngModel)]="value" [id]="id" class="checkbox__input" type="checkbox" [disabled]="disabled">
  <span class="checkbox__checkmark">
    <svg-icon src="icons/interface-interaction/check.svg" aria-hidden="true"></svg-icon>
  </span>
  <span class="checkbox__label">{{label}}</span>
</label>
