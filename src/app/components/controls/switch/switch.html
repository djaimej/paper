<article class="switch-container">
  <label class="switch">
    <input #el [id]="id()" type="checkbox" [checked]="controlValue()" [disabled]="isDisabled()"
      (change)="update(el.checked)">
    <span class="slider"></span>
  </label>
  <span class="label" [class.disabled]="isDisabled()">{{ label() }}</span>
</article>
