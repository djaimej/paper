<label class="radio">
  <input #el [id]="id()" [name]="name()" [value]="value()" class="invisible" type="radio" [checked]="controlValue()"
    [disabled]="isDisabled()" (change)="update(el.checked)">
  <span class="mark">
    <svg-icon src="icons/interface-interaction/check.svg"></svg-icon>
  </span>
</label>
